<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneDrop</title>
<style>

  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 ui-rounded,-apple-system,"Segoe UI",Roboto,system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:26px; margin:0 0 16px; }
  h2 { font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--mute); margin:24px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; }
  .center { text-align:center; }
  .mute { color:var(--mute); font-size:14px; }
  canvas { background:#fff; border-radius:16px; padding:0; width:240px; height:240px; image-rendering:pixelated; }
  ol { text-align:left; padding-left:22px; margin:16px 0 8px; }
  .chip { display:inline-block; background:var(--ok); color:var(--onok); font-weight:600; font-size:13px; padding:2px 12px; border-radius:999px; }
  button { font:inherit; font-weight:600; color:#2b2a28; background:var(--acc); border:0; border-radius:999px; padding:10px 22px; cursor:pointer; }
  button.soft { background:var(--tint); color:var(--fg); padding:6px 16px; font-size:14px; }
  button:disabled { opacity:.45; cursor:default; }
  #drop { border:2px dashed var(--acc); border-radius:20px; padding:28px 16px; text-align:center; background:linear-gradient(var(--bg),var(--tint)); }
  #drop.over { border-style:solid; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .plate { flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-size:11px; font-weight:700; color:#2b2a28; background:#cdefe0; }
  .grow { flex:1; min-width:0; }
  .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .bar { height:6px; border-radius:999px; background:var(--tint); margin:6px 0 2px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); border-radius:999px; }
  .err { color:var(--err); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>PhoneDrop</h1>

  <section id="pair" class="card center">
    <canvas id="qr" width="328" height="328"></canvas>
    <ol>
      <li data-t="step1"></li>
      <li data-t="step2"></li>
    </ol>
    <p class="mute" data-t="private"></p>
  </section>

  <section id="app" hidden>
    <span class="chip" id="peer"></span>
    <h2 data-t="toPhone"></h2>
    <div id="drop">
      <p data-t="dropHere" style="margin:0 0 12px"></p>
      <button id="pick" data-t="choose"></button>
      <input id="file" type="file" multiple hidden>
    </div>
    <div id="ups" class="card" style="margin-top:12px" hidden></div>
    <h2 data-t="fromPhone"></h2>
    <div class="card">
      <p id="none" class="mute" style="margin:0" data-t="nothing"></p>
      <div id="downs"></div>
      <button id="all" class="soft" style="margin-top:12px" data-t="getAll" hidden></button>
    </div>
    <p class="mute" data-t="keepOpen"></p>
  </section>

  <section id="lost" class="card center" hidden>
    <p data-t="closed"></p>
    <button onclick="sessionStorage.clear();location.reload()" data-t="again"></button>
  </section>
</main>

const sleep = ms => new Promise(r => setTimeout(r, ms));
function size(n) { const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (n >= 1000 && i < 3) { n /= 1000; i++; } return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + ' ' + u[i]; }
const TYPES = { image: ['#cfe6f7', 'jpg jpeg png heic heif gif webp dng raw bmp svg'], video: ['#f9d5df', 'mp4 mov mkv avi webm 3gp m4v'], audio: ['#ffd9c7', 'mp3 wav m4a flac ogg aac opus'], arch: ['#e1daf7', 'zip rar 7z tar gz apk dmg iso exe msi'] };
function row(name, sub) {
  const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
  const el = document.createElement('div'); el.className = 'row';
  const plate = document.createElement('div'); plate.className = 'plate'; plate.textContent = ext.slice(0, 4).toUpperCase();
  for (const k in TYPES) if (TYPES[k][1].split(' ').includes(ext)) plate.style.background = TYPES[k][0];
  const g = document.createElement('div'); g.className = 'grow';
  const n = document.createElement('div'); n.className = 'name'; n.textContent = name;
  const bar = document.createElement('div'); bar.className = 'bar'; bar.hidden = true; bar.appendChild(document.createElement('i'));
  const s = document.createElement('div'); s.className = 'mute'; s.textContent = sub;
  g.append(n, bar, s); el.append(plate, g);
  return { el, sub: s, progress(p) { bar.hidden = false; bar.firstChild.style.width = (p * 100).toFixed(1) + '%'; }, done() { bar.hidden = true; } };
}

// ---- session ----
let K = null, SID = '', closed = false, counter = Date.now() * 1000;
function lost() { closed = true; sessionStorage.clear(); $('pair').hidden = $('app').hidden = true; $('lost').hidden = false; }
async function call(method, target, body) {
  const auth = b64u(seal(K, enc.encode(method + ' ' + target + ' ' + (++counter)), 'pd3 auth'));
  const r = await fetch(target, { method, headers: { 'X-PD-Session': SID, 'X-PD-Auth': auth }, body, cache: 'no-store' });
  if (r.status === 403) { lost(); throw new Error('closed'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r;
}
async function rpc(path, query, obj) {
  const body = obj ? seal(K, enc.encode(JSON.stringify(obj)), 'pd3 req ' + path) : null;
  const r = await call('POST', path + (query || ''), body);
  return JSON.parse(dec.decode(open(K, new Uint8Array(await r.arrayBuffer()), 'pd3 res ' + path)));
}
async function retrying(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); } catch (e) { if (closed || i >= 5) throw e; await sleep(500 << i); }
  }
}

async function pair() {
  const saved = sessionStorage.getItem('pd');
  if (saved) {
    const s = JSON.parse(saved); K = unb64u(s.k); SID = s.sid;
    try { await rpc('/w/list'); return start(s.name); } catch (e) { if (closed) { closed = false; $('lost').hidden = true; $('pair').hidden = false; } sessionStorage.clear(); }
  }
  const priv = crypto.getRandomValues(new Uint8Array(32)), pub = x25519(priv, BASE);
  SID = hex(sha256(pub).subarray(0, 8));
  const link = 'phonedrop://web?v=3&k=' + b64u(pub), m = qrMatrix(link), cv = $('qr'), g = cv.getContext('2d'), q = 4, sc = cv.width / (m.length + 2 * q);
  cv.dataset.link = link;   // the same public text the code holds, for tools that can't see pixels
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#000';
  m.forEach((line, y) => line.forEach((v, x) => { if (v) g.fillRect((x + q) * sc, (y + q) * sc, sc, sc); }));
  for (;;) {
    try {
      const r = await fetch('/w/session?id=' + SID, { cache: 'no-store' });
      if (r.ok) {
        const j = await r.json(), A = unb64u(j.a), shared = x25519(priv, A);
        if (shared.some(x => x)) {
          K = hkdf(shared, cat(A, pub), 'phonedrop web v3');
          const info = JSON.parse(dec.decode(open(K, unb64u(j.c), 'pd3 hello')));
          sessionStorage.setItem('pd', JSON.stringify({ k: b64u(K), sid: SID, name: info.name }));
          return start(info.name);
        }
      }
    } catch (e) { /* not scanned yet, or the phone is unreachable: keep waiting */ }
    await sleep(1000);
  }
}

function start(name) {
  $('pair').hidden = true; $('app').hidden = false; $('peer').textContent = T.connected + name;
  poll();
}

// ---- phone -> browser ----
const shown = new Map();
async function poll() {
  while (!closed) {
    try {
      const files = (await rpc('/w/list')).files;
      for (const f of files) if (!shown.has(f.id)) {
        const r = row(f.name, size(f.size)), b = document.createElement('button');
        b.className = 'soft'; b.textContent = T.get; b.onclick = () => download(f);
        r.el.appendChild(b); $('downs').appendChild(r.el);
        shown.set(f.id, { f, r, b, state: 'new' });
      }
      for (const [id, s] of shown) if (s.state === 'new' && !files.some(f => f.id === id)) { s.r.el.remove(); shown.delete(id); }
      $('none').hidden = shown.size > 0;
      $('all').hidden = [...shown.values()].filter(s => s.state === 'new').length < 2;
    } catch (e) { /* retried on the next round */ }
    await sleep(2000);
  }
}
$('all').onclick = () => { for (const s of shown.values()) if (s.state === 'new') download(s.f); };
let downloading = Promise.resolve();
function download(f) {
  const s = shown.get(f.id);
  if (!s || (s.state !== 'new' && s.state !== 'failed')) return;
  s.state = 'queued'; s.b.hidden = true; s.r.sub.className = 'mute'; s.r.sub.textContent = T.waiting + ' · ' + size(f.size);
  downloading = downloading.then(() => fetchFile(s)).catch(() => { });
}
async function fetchFile(s) {
  const f = s.f, parts = [];
  let frame = 0, got = 0;
  try {
    await retrying(async () => {
      const r = await call('GET', '/w/dl?f=' + f.id + '&from=' + frame), rd = r.body.getReader();
      let buf = new Uint8Array(0);
      for (;;) {
        const { done, value } = await rd.read();
        if (value) {
          buf = buf.length ? cat(buf, value) : value;
          let o = 0;
          while (buf.length - o >= 4) {
            const n = (buf[o] << 24 | buf[o + 1] << 16 | buf[o + 2] << 8 | buf[o + 3]) >>> 0;
            if (n > (1 << 20) + 28) throw new Error('bad frame');
            if (buf.length - o < 4 + n) break;
            const plain = open(K, buf.subarray(o + 4, o + 4 + n), 'pd3 dl ' + f.id + ' ' + frame);
            parts.push(new Blob([plain])); frame++; got += plain.length; o += 4 + n;
            s.r.progress(f.size ? got / f.size : 1); s.r.sub.textContent = size(got) + ' / ' + size(f.size);
            await sleep(0);   // let the page repaint
          }
          buf = buf.slice(o);
        }
        if (done) break;
      }
      if (got < f.size) throw new Error('incomplete');
    });
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(parts, { type: 'application/octet-stream' })); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    s.state = 'done'; s.r.done(); s.r.sub.textContent = '✓ ' + T.saved + ' · ' + size(f.size);
  } catch (e) {
    s.state = 'failed'; s.r.done(); s.r.sub.className = 'err'; s.r.sub.textContent = T.failed; s.b.textContent = T.retry; s.b.hidden = false;
  }
}

// ---- browser -> phone ----
const CHUNK = 2 << 20;
let uploading = Promise.resolve();
function send(files) {
  for (const file of files) {
    const r = row(file.name, T.waiting + ' · ' + size(file.size));
    $('ups').hidden = false; $('ups').appendChild(r.el);
    uploading = uploading.then(() => upload(file, r)).catch(() => { });
  }
}
async function upload(file, r) {
  try {
    const id = (await retrying(() => rpc('/w/up/init', '', { name: file.name, size: file.size, mtime: file.lastModified }))).id;
    for (let i = 0, o = 0; o < file.size || i === 0; i++, o += CHUNK) {
      const box = seal(K, new Uint8Array(await file.slice(o, o + CHUNK).arrayBuffer()), 'pd3 up ' + id + ' ' + i);
      await retrying(() => call('PUT', '/w/up/chunk?id=' + id + '&i=' + i, box));
      const done = Math.min(file.size, o + CHUNK);
      r.progress(file.size ? done / file.size : 1); r.sub.textContent = size(done) + ' / ' + size(file.size);
    }
    await retrying(() => rpc('/w/up/finish', '?id=' + id));
    r.done(); r.sub.textContent = '✓ ' + T.sent + ' · ' + size(file.size);
  } catch (e) { r.done(); r.sub.className = 'err'; r.sub.textContent = T.failed; }
}
$('pick').onclick = () => $('file').click();
$('file').onchange = e => { send(e.target.files); e.target.value = ''; };
const drop = $('drop');
addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
addEventListener('dragleave', () => drop.classList.remove('over'));
addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if (K && !closed) send(e.dataTransfer.files); });

pair();
</script>
</body>
</html>
